# Public/synthetic data only. Opt-in legacy reference stack, not an accredited environment.
services:
  # Jupyter Lab for development
  jupyter:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8501:8501"  # Streamlit
      - "127.0.0.1:8050:8050"  # Dash
    volumes:
      - ./:/workspace
      - jupyter_data:/home/jovyan/.jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - ds-handbook
    restart: unless-stopped

  # MLflow tracking server
  mlflow:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/app/mlruns
      - mlflow_artifacts:/app/mlartifacts
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-mlflow}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/app/mlartifacts
    depends_on:
      - postgres
    networks:
      - ds-handbook
    restart: unless-stopped

  # PostgreSQL for MLflow backend
  postgres:
    profiles: ["reference"]
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mlflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlflow}
      - POSTGRES_DB=${POSTGRES_DB:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ds-handbook
    restart: unless-stopped

  # Redis for caching and message broker
  redis:
    profiles: ["reference"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ds-handbook
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - jupyter
      - mlflow
    networks:
      - ds-handbook
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    profiles: ["reference"]
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - ds-handbook
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    profiles: ["reference"]
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - ds-handbook
    restart: unless-stopped

  # Security scanner service
  security-scanner:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.security
    volumes:
      - ./:/app
      - ./reports:/app/reports
    environment:
      - SECURITY_SCAN_SCHEDULE=0 2 * * *
    networks:
      - ds-handbook
    restart: unless-stopped

  # Documentation server
  docs:
    profiles: ["reference"]
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./docker/nginx/docs.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ds-handbook
    restart: unless-stopped

  # CAC/PIV Authentication Service
  cac-auth:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cac-auth
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./security-compliance/auth:/app/auth
      - ./docker/cac-auth/config:/app/config
      - cac_auth_logs:/app/logs
      - cac_auth_certs:/app/certs
    environment:
      - CAC_CONFIG_DIR=/app/config
      - CAC_LOG_LEVEL=INFO
      - CAC_API_HOST=0.0.0.0
      - CAC_API_PORT=8000
      - ENABLE_SMART_CARD=false  # Set to true if smart card readers available
      - USE_DATABASE=false
      - CAC_RELOAD=false  # Set to true for development
    depends_on:
      - postgres
      - redis
      - vault
    networks:
      ds-handbook:
        ipv4_address: 172.20.0.15
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Consul for Vault HA backend
  consul:
    profiles: ["reference"]
    image: hashicorp/consul:1.16.1
    ports:
      - "127.0.0.1:8500:8500"
      - "127.0.0.1:8600:8600/udp"
    volumes:
      - consul_data:/consul/data
      - ./docker/vault/consul.hcl:/consul/config/consul.hcl:ro
    command: consul agent -config-file=/consul/config/consul.hcl
    networks:
      ds-handbook:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 3

  # HashiCorp Vault for credential management
  vault:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.vault
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - vault_tls:/vault/tls
      - ./docker/vault/scripts:/vault/scripts:ro
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_API_ADDR=https://vault:8200
      - VAULT_CLUSTER_ADDR=https://vault:8201
      - VAULT_UI=true
      - VAULT_LOG_LEVEL=info
      - VAULT_LOG_FORMAT=json
      - VAULT_DISABLE_MLOCK=true
    depends_on:
      consul:
        condition: service_healthy
    networks:
      ds-handbook:
        ipv4_address: 172.20.0.11
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_add:
      - IPC_LOCK

  # Vault initialization service (runs once)
  vault-init:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: docker/Dockerfile.vault
    volumes:
      - vault_data:/vault/data
      - vault_tls:/vault/tls:ro
      - ./docker/vault/scripts:/vault/scripts:ro
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=false
      - VAULT_CACERT=/vault/tls/ca.crt
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - ds-handbook
    command: ["/vault/scripts/init-vault.sh"]
    restart: "no"

volumes:
  jupyter_data:
  mlflow_data:
  mlflow_artifacts:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  consul_data:
  vault_data:
  vault_logs:
  vault_tls:
  cac_auth_logs:
  cac_auth_certs:

networks:
  ds-handbook:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
