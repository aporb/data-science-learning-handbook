# Public/synthetic data only. One opt-in notebook, not a federal platform replica.
services:
  notebook:
    profiles: [learning]
    build:
      context: .
      dockerfile: docker/Dockerfile.learning
    ports:
      - "127.0.0.1:${HANDBOOK_NOTEBOOK_PORT:-8888}:8888"
    volumes:
      - ./chapters:/home/learner/work/chapters:ro
      - learning_notebooks:/home/learner/work/notebooks
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      JUPYTER_RUNTIME_DIR: /tmp/jupyter-runtime
      JUPYTER_CONFIG_DIR: /tmp/jupyter-config
      JUPYTER_DATA_DIR: /tmp/jupyter-data
      JUPYTERLAB_SETTINGS_DIR: /tmp/jupyter-settings
      JUPYTERLAB_WORKSPACES_DIR: /tmp/jupyter-workspaces
      IPYTHONDIR: /tmp/ipython
      MPLCONFIGDIR: /tmp/matplotlib
    restart: "no"
volumes:
  learning_notebooks:
